[package]
name = "niri-profiles"
version = "0.3.0"
edition = "2021"
description = "Material You переключатель профилей конфигурации Niri"

[dependencies]
slint = "1.8"
# Нативный диалог выбора папки через xdg-desktop-portal (без GTK)
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }

[build-dependencies]
slint-build = "1.8"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
